name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macbookairm1rs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v1

      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 20.15.1

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test